<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งการบ้าน - Thammasat</title>
    <link rel="stylesheet" th:href="@{/css/submitstyle.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .user-profile { position: relative; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        #user-dropdown { display: none; position: absolute; top: 110%; right: 0; background: #fff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); min-width: 180px; z-index: 999; overflow: hidden; }
        .dd-header { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
        .dd-header-name { font-weight: 600; font-size: 14px; }
        .dd-header-role { font-size: 12px; color: #888; }
        .dd-logout { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #e74c3c; text-decoration: none; font-size: 14px; }
        .dd-logout:hover { background: #fff5f5; }
        #file-name-display { margin-top: 15px; font-weight: 600; color: #e67e22; font-size: 14px; }
        .border-none { border: none !important; }
    </style>
</head>
<body>
    <div class="top-orange-bar"></div>
    <div class="container">
        <header class="main-header">
             <div class="logo-section">
                <img th:src="@{/images/TU logo.png}" alt="Thammasat Logo" class="logo-img">
                <div class="logo-text">
                    <span class="uni-name-th">มหาวิทยาลัยธรรมศาสตร์</span><br>
                    <span class="uni-name-en">Thammasat University</span>
                </div>
            </div>
            <div class="user-section">
                <div class="user-profile" onclick="toggleUserMenu()">
                    <div class="avatar-placeholder"><i class="fa-regular fa-user"></i></div>
                    <span class="user-name" th:text="${userDisplayName != null ? userDisplayName : 'ชื่อนักศึกษา'}">นักศึกษา</span>
                    <i class="fa-solid fa-chevron-down" style="font-size:11px;"></i>
                    <div id="user-dropdown">
                        <div class="dd-header">
                            <div class="dd-header-name" th:text="${userDisplayName != null ? userDisplayName : 'ชื่อนักศึกษา'}">ชื่อนักศึกษา</div>
                            <div class="dd-header-role">นักศึกษา</div>
                        </div>
                        <a href="/logout" class="dd-logout">
                            <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-content">
            <!-- 1. Breadcrumb -->
            <div class="breadcrumb">
                <a th:href="@{/home/student}">หน้าแรก</a> / 
                <a th:href="@{/dashboard/student(id=${courseId})}" th:text="'วิชา ' + ${courseId}">วิชา</a> / 
                <span th:text="${assignmentTitle}">ชื่อการบ้าน</span>
            </div>

            <!-- 2. กล่องรายละเอียดงาน -->
            <div class="submit-card">
                <div class="card-header">
                    <h2 th:text="${assignmentTitle}">หัวข้อการบ้าน</h2>
                </div>
                <div class="card-body">
                    <p class="assignment-desc" th:text="${assignmentDescription}">คำอธิบายการบ้าน...</p>
                    
                    <div th:if="${assignmentFileName != null}" class="meta-item" style="margin-bottom: 15px;">
                        <i class="fa-solid fa-paperclip icon-meta" style="color: #e67e22;"></i>
                        <span style="font-weight: 500;">ไฟล์แนบ: </span>
                        <a th:href="@{'/api/assignments/download/' + ${assignmentFileName}}" class="file-link" style="color: #3498db; text-decoration: underline;">
                           <span th:text="${assignmentFileName}">ชื่อไฟล์.pdf</span>
                        </a>
                    </div>

                    <div class="meta-item">
                        <i class="fa-regular fa-calendar icon-meta"></i> 
                        <span th:text="'กำหนดส่ง: ' + ${deadline}">วันที่ส่ง</span>
                    </div>
                </div>
            </div>

            <!-- 3. ฟอร์มส่งงาน (กล่องล่าง) -->
            <form th:action="@{/api/assignments/submit/upload}" method="POST" enctype="multipart/form-data">
                <!-- Hidden Fields สำหรับส่งข้อมูลหลังบ้าน -->
                <input type="hidden" name="assignmentId" th:value="${assignmentId}"> 
                <input type="hidden" name="studentId" th:value="${userUsername}">
                <input type="hidden" name="courseId" th:value="${courseId}">

                <div class="submit-card" style="margin-top: 20px;">
                    <div class="card-header border-none">
                        <h2>กล่องสำหรับส่งงาน</h2>
                    </div>
                    <div class="card-body">
                        <!-- เลือกไฟล์ -->
                        <input type="file" name="file" id="file-input" style="display: none;" onchange="showFileName(this)" required>
                        <div class="upload-box" id="upload-box" onclick="document.getElementById('file-input').click()" style="cursor: pointer; border: 2px dashed #ddd; padding: 40px; text-align: center; border-radius: 8px;">
                            <i class="fa-solid fa-arrow-up-from-bracket upload-icon" style="font-size: 2rem; color: #aaa; margin-bottom: 10px;"></i><br>
                            <span class="upload-text">คลิกเพื่ออัปโหลดไฟล์การบ้าน</span>
                            <div id="file-name-display"></div>
                        </div>

                        <!-- ปุ่มกดยืนยัน (มีชุดเดียวพอ) -->
                        <div class="button-group" style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                            <button type="button" class="btn-cancel" onclick="window.history.back()" style="padding: 10px 25px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer;">ยกเลิก</button>
                            <button type="submit" class="btn-submit" style="padding: 10px 25px; border-radius: 6px; border: none; background: #f39c12; color: #fff; cursor: pointer; font-weight: 600;">ยืนยันส่งงาน</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleUserMenu() {
            const dd = document.getElementById('user-dropdown');
            dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
        }

        function showFileName(input) {
            const display = document.getElementById('file-name-display');
            if (input.files && input.files[0]) {
                display.innerHTML = `<i class="fa-solid fa-file-pdf"></i> ไฟล์ที่เลือก: ${input.files[0].name}`;
            }
        }

        window.onclick = function(event) {
            if (!event.target.closest('.user-profile')) {
                document.getElementById("user-dropdown").style.display = "none";
            }
        }
    </script>
</body>
</html>
